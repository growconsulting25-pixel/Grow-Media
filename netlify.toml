[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's Next.js runtime: turns server rendering, route handlers
# (/auth/callback) and proxy.ts (locale redirects, auth) into functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"
